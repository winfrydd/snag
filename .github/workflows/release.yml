# Push a tag like v1.2.0 and GitHub builds the zip and publishes the release.
# get.ps1 always installs the newest release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: ./build-release.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag (Get-Item dist/*.zip).FullName --title "Snag $($tag.TrimStart('v'))" --generate-notes
